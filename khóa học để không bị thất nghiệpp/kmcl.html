<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Suggestions - BetterFuture</title>
  <style>
    /* Base Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .bf-box {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      animation: fadeIn 0.6s ease-in-out;
    }

    .bf-box h2 {
      text-align: center;
      color: #2b4c7e;
      margin-bottom: 25px;
      font-size: 1.8rem;
    }

    .bf-list {
      list-style: none;
      padding: 0;
      margin-bottom: 30px;
    }

    .bf-list li {
      background: #f4f7fb;
      padding: 14px 18px;
      margin: 10px 0;
      border-left: 5px solid #0078d4;
      border-radius: 8px;
      font-size: 1rem;
      color: #333;
      transition: background 0.3s;
    }

    .bf-list li:hover {
      background: #e9f3ff;
    }

    .bf-button {
      display: block;
      width: fit-content;
      margin: 0 auto;
      padding: 12px 24px;
      background: linear-gradient(to right, #0078d4, #005a9e);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 120, 212, 0.4);
      transition: transform 0.2s, opacity 0.3s;
    }

    .bf-button:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bf-box">
    <h2>🔍 Recommended Skills for You</h2>
    <ul class="bf-list" id="bf-suggestions">
      <!-- Suggestions inserted via JavaScript -->
    </ul>
    <button class="bf-button" onclick="goToResult()">✅ I've Completed My Course</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const skills = [
        "Data Analysis with Excel",
        "Python Programming for Beginners",
        "AI Problem-Solving Techniques",
        "Effective Workplace Communication",
        "Critical Thinking & Decision Making"
      ];
      const list = document.getElementById("bf-suggestions");
      skills.forEach(skill => {
        const li = document.createElement("li");
        li.textContent = skill;
        list.appendChild(li);
      });
    });

    function goToResult() {
      window.location.href = "result.html"; // change to your target page
    }
  </script>
</body>
</html>
